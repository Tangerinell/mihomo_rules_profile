          )

          for jntm in "${LISTS[@]}"; do
            IFS="|" read -r filepath url <<< "$jntm"
            echo "Processing $filepath..."
            
            # 获取文件所在的父目录路径
            filedir=$(dirname "$filepath")
            
            # 如果目录不存在，则递归创建该目录
            if [ "$filedir" != "." ]; then
              mkdir -p "$filedir"
            fi

            # 下载文件到指定位置
            curl -sfL "$url" -o "$filepath" || echo "Failed to download $filepath"
          done

      - name: global config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: commit
        id: commit
        run: |
          # 暂存当前目录下所有发生变化的文件（包括新创建的多级目录和文件）
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto update rules $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          fi
